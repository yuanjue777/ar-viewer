<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>方块战线</title>
<style>
  :root{
    --bg:#0a0e16;
    --bg2:#101726;
    --line:#1c2940;
    --ink:#d5e4ee;
    --ink-dim:#68809a;
    --gold:#f0c46a;
    --wood:#c98f5b;
    --hp:#6ee7a0;
    --mage:#4f8dff;
    --archer:#57d474;
    --warrior:#ff5d5d;
    --qblue:#4fa8ff;
    --qgreen:#5ad48a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{height:100%;height:100dvh;display:flex;flex-direction:column;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

  header{
    display:flex;align-items:center;gap:12px;
    padding:4px 12px;border-bottom:1px solid var(--line);background:var(--bg2);
  }
  .stat{display:flex;align-items:baseline;gap:3px}
  .stat b{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat small{font-size:10px;color:var(--ink-dim)}
  .money b{color:var(--gold)} .woodS b{color:var(--wood)} .life b{color:var(--hp)} .wave b{color:#8ab8d8}
  header .hbtn{
    background:none;border:1px solid var(--line);color:#8ab8d8;
    border-radius:4px;padding:3px 9px;font-size:12px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
  }
  header .hbtn.on{background:#8ab8d8;color:#0a0e16;border-color:#8ab8d8}
  #speedBtn{margin-left:auto}

  #stage{flex:1;position:relative;display:flex;justify-content:center;align-items:flex-start;
    padding-top:3px;min-height:0;background:var(--bg)}
  canvas{display:block;touch-action:none}

  #dock{
    display:flex;align-items:stretch;gap:8px;
    padding:4px 12px;border-top:1px solid var(--line);
    background:var(--bg2);
  }
  #dock .spacer{flex:1}
  .tile{
    min-width:58px;border:1px solid var(--line);border-radius:8px;background:#16223a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:11px;color:var(--ink);padding:4px 8px;position:relative;
  }
  .tile .ic{width:13px;height:13px;border-radius:4px}
  .tile .lv{font-size:9px;color:var(--ink-dim)}
  .tile.on{border-color:#8ab8d8;background:#1b2c48}
  #tileSkill .ic{background:linear-gradient(135deg,var(--mage),var(--warrior))}
  #tileItem .ic{background:linear-gradient(135deg,#c8d2dc,#b070ff)}
  #tileMine .ic{background:var(--gold)}
  #tileMill .ic{background:var(--wood)}

  /* ---- 信息区（常驻） ---- */
  #info{
    height:76px;display:flex;align-items:center;gap:8px;
    padding:4px 12px;border-top:1px solid var(--line);background:var(--bg2);overflow:hidden;
  }
  #info .hint{flex:1;color:var(--ink-dim);font-size:12px;line-height:1.5}
  #info .card{flex:1;font-size:10px;line-height:1.42;min-width:0}
  #info .card b{font-size:12px}
  #info .card span{color:var(--ink-dim)}
  #info .card.shopHead{flex:0 0 auto;max-width:118px}
  #info .btn .sub{display:block;color:var(--ink-dim);font-size:9.5px;margin-top:1px;line-height:1.3}
  #info .btn.grow{flex:1;text-align:left}
  .btn{
    border:1px solid var(--line);border-radius:6px;background:#16223a;color:var(--ink);
    padding:6px 9px;text-align:center;font-size:12px;line-height:1.3;flex-shrink:0;
  }
  .btn:disabled{opacity:.35}
  .btn .cost{color:var(--gold);font-size:11px;font-variant-numeric:tabular-nums}
  .btn .costw{color:var(--wood);font-size:11px;font-variant-numeric:tabular-nums}

  /* ---- 背包行（技能书+装备） ---- */
  #inv{
    display:flex;align-items:center;gap:7px;
    height:52px;padding:4px 12px calc(env(safe-area-inset-bottom) + 4px);
    background:var(--bg2);border-top:1px solid var(--line);
    overflow-x:auto;overflow-y:hidden;
  }
  #inv .invLabel{font-size:10px;color:var(--ink-dim);flex-shrink:0;line-height:1.3}
  .book{
    width:40px;height:40px;flex-shrink:0;border-radius:7px;background:#16223a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:10px;font-weight:600;touch-action:none;position:relative;
    border:1.5px solid var(--line);
  }
  .book small{font-size:8px;font-weight:400;color:var(--ink-dim)}
  #dragGhost{position:fixed;z-index:80;pointer-events:none;opacity:.9;display:none}

  #toast{
    position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:60;
    background:#1b2c48;border:1px solid #2b3d5e;color:var(--ink);
    padding:8px 16px;border-radius:8px;font-size:12px;max-width:80%;
    opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;line-height:1.6;
  }
  #toast.show{opacity:1}

  #overlay{
    position:fixed;inset:0;z-index:30;background:rgba(10,14,22,.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;padding:20px;
  }
  #overlay.hide{display:none}
  #overlay h1{font-size:26px;letter-spacing:.14em;color:#8ab8d8}
  #overlay p{color:var(--ink-dim);font-size:13px;line-height:1.8;max-width:480px}
  #overlay .lg{border:1px solid #2a6ee0;background:#2a6ee0;color:#fff;border-radius:8px;padding:10px 40px;font-size:16px;letter-spacing:.2em}
  #overlay .cls{display:flex;gap:14px;font-size:12px;color:var(--ink-dim)}
  #overlay .cls i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}

  #rotate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink-dim);text-align:center}
  #rotate .ph{font-size:40px;animation:spin90 1.6s ease-in-out infinite}
  @keyframes spin90{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait){#rotate{display:flex}}
  @media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(90deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat money"><b id="uiMoney">0</b><small>金</small></div>
    <div class="stat woodS"><b id="uiWood">0</b><small>木</small></div>
    <div class="stat life"><b id="uiLife">0</b><small>基地</small></div>
    <div class="stat wave"><b id="uiWave">0/15</b><small>波</small></div>
    <button class="hbtn" id="speedBtn">×1</button>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="dock">
    <button class="tile" id="tileSkill"><span class="ic"></span>技能<span class="lv">出4本书</span></button>
    <button class="tile" id="tileItem"><span class="ic"></span>装备<span class="lv">roll品质</span></button>
    <button class="tile" id="tileMine"><span class="ic"></span>金矿<span class="lv" id="mineLvT">Lv1</span></button>
    <button class="tile" id="tileMill"><span class="ic"></span>伐木场<span class="lv" id="millLvT">Lv1</span></button>
    <div class="spacer"></div>
  </div>
  <div id="info"><div class="hint"></div></div>
  <div id="inv"><div class="invLabel">背包</div></div>
</div>

<div id="dragGhost"></div>
<div id="toast"></div>

<div id="overlay">
  <h1>方块战线</h1>
  <div class="cls">
    <span><i style="background:var(--mage)"></i>法师·主智力</span>
    <span><i style="background:var(--archer)"></i>游侠·主敏捷</span>
    <span><i style="background:var(--warrior)"></i>战士·主力量</span>
  </div>
  <p>魔兽式属性：主属性加攻击、力量加血、敏捷加护甲攻速、护甲按公式减伤、魔抗按百分比扣技能伤害。打怪全体吃经验升级。技能书/装备（白绿蓝紫四档品质）都从商店 roll 进背包，<b>拖到英雄身上</b>穿戴学习。</p>
  <button class="lg" id="startBtn">开 始</button>
</div>

<div id="rotate"><div class="ph">📱</div><div>请横屏游玩</div></div>

<script>
'use strict';
/* ================= 职业（魔兽式属性）================= */
const ROWS=3, HCOLS=3, BCOLS=9, COLS=HCOLS+BCOLS, TOTAL_WAVES=15, HERO_COST=50, MAX_HEROES=3;
const MAX_SLOTS=4, MAX_SKILL_LV=5, MAX_EQUIP=4, MAX_HERO_LV=15;
const COL_CLASS=['mage','archer','warrior'];
/* bat=基础攻击间隔s wep=武器基础攻击 main=主属性(加攻) grow=每级属性成长 */
const CLASSES={
  mage:  {name:'法师',color:'#4f8dff',hpB:60,wep:6, bat:1.9,baseArmor:1,range:9,  splash:1.1,main:'int',
          attr:{str:8, agi:12,int:24},grow:{str:1.1,agi:1.4,int:3.2},desc:'远程溅射·主智力'},
  archer:{name:'游侠',color:'#57d474',hpB:70,wep:8, bat:1.3,baseArmor:2,range:6,  splash:0,  main:'agi',
          attr:{str:10,agi:22,int:12},grow:{str:1.4,agi:2.9,int:1.5},desc:'中程速射·主敏捷'},
  warrior:{name:'战士',color:'#ff5d5d',hpB:90,wep:15,bat:1.7,baseArmor:4,range:1.6,splash:0,  main:'str',
          attr:{str:22,agi:10,int:8}, grow:{str:2.7,agi:1.3,int:1.0},desc:'近战坦克·主力量'},
};
const ADV={
  mage:  {name:'大法师',atk:1.6,hp:1.4,bat:1,  range:1,  splash:.4},
  archer:{name:'神射手',atk:1.5,hp:1.3,bat:.85,range:1.5,splash:0},
  warrior:{name:'狂战士',atk:1.6,hp:1.6,bat:.9, range:.4, splash:0},
};
const ADV_LV=5, ADV_GOLD=150, ADV_WOOD=50;
function xpNeed(lv){return 40+45*(lv-1);}
/* 魔兽护甲减伤公式 */
function armorRed(a){const v=a*.06;return v>0?v/(1+v):0;}

/* ================= 技能书 ================= */
const SKB={
  '狂战士之血':{cat:'str',q:'qblue', short:'狂血',cd:0, desc:'被动：血越低回血越快、受伤越少（血量50%时约每秒回2%×等级）'},
  '荆棘光环':  {cat:'str',q:'qgreen',short:'荆棘',cd:0, desc:'被动：反弹15%×等级伤害，附加0.4×力量×等级（魔法伤害）'},
  '多重射击':  {cat:'agi',q:'qblue', short:'多重',cd:0, desc:'被动：普攻额外射击 等级×0.5 个敌人（70%伤害）'},
  '沁毒射击':  {cat:'agi',q:'qgreen',short:'沁毒',cd:0, desc:'被动：普攻附带毒伤=敏捷×(0.35+0.15×等级)（魔法伤害）'},
  '召唤熊德':  {cat:'int',q:'qblue', short:'熊德',cd:22,desc:'主动：召近战熊灵冲锋接敌，属性随智力成长'},
  '火球术':    {cat:'int',q:'qgreen',short:'火球',cd:7, desc:'主动：单体魔法伤害（智力×3×等级+40），弹道线'},
  '冰风暴':    {cat:'int',q:'qgreen',short:'冰风',cd:10,desc:'主动：范围魔法AOE+减速，显示范围圈'},
};
const CATS={str:{label:'力量',color:'#ff5d5d'},agi:{label:'敏捷',color:'#57d474'},int:{label:'智力',color:'#4f8dff'}};
const PACK_COST=80, ROLL_COST=40, PACK_N=4;

/* ================= 装备（roll品质）================= */
const EQ_KINDS={
  sword:{n:'利剑',s:'剑',roll:m=>({atk:Math.round(7*m)})},
  plate:{n:'胸甲',s:'甲',roll:m=>({armor:Math.round(3*m),hp:Math.round(35*m)})},
  boots:{n:'战靴',s:'靴',roll:m=>({aspd:Math.round(10*m)/100})},
  ring: {n:'指环',s:'戒',roll:m=>({all:Math.round(3*m)})},
  cloak:{n:'披风',s:'披',roll:m=>({mres:Math.round(8*m)/100,hp:Math.round(20*m)})},
};
const QUALS=[
  {k:'common',n:'普通',c:'#c8d2dc',m:1,  w:55},
  {k:'fine',  n:'精良',c:'#5ad48a',m:1.7,w:27},
  {k:'rare',  n:'稀有',c:'#4fa8ff',m:2.6,w:13},
  {k:'epic',  n:'史诗',c:'#b070ff',m:4,  w:5},
];
const EQ_ROLL1=45, EQ_ROLL4=160;
function rollQuality(){
  let r=Math.random()*100;
  for(const q of QUALS){if(r<q.w)return q;r-=q.w;}
  return QUALS[0];
}
function rollEquip(){
  const kinds=Object.keys(EQ_KINDS);
  const kind=kinds[Math.floor(Math.random()*kinds.length)];
  const q=rollQuality();
  return {t:'eq',kind,q:q.k,stats:EQ_KINDS[kind].roll(q.m)};
}
function qOf(item){return QUALS.find(q=>q.k===item.q);}
function eqDesc(item){
  const s=item.stats,p=[];
  if(s.atk)p.push('攻击+'+s.atk);
  if(s.armor)p.push('护甲+'+s.armor);
  if(s.hp)p.push('生命+'+s.hp);
  if(s.aspd)p.push('攻速+'+Math.round(s.aspd*100)+'%');
  if(s.all)p.push('全属性+'+s.all);
  if(s.mres)p.push('魔抗+'+Math.round(s.mres*100)+'%');
  return p.join(' ');
}

/* ================= 怪物（带护甲/魔抗）================= */
const MOBS={
  normal:{hp:40, spd:1.1,atk:8, reward:7, xp:5, r:.30,lives:1,armor:0,mres:0,  color:'#c95bff'},
  fast:  {hp:26, spd:1.9,atk:6, reward:8, xp:6, r:.23,lives:1,armor:0,mres:0,  color:'#ff9d4d'},
  tank:  {hp:150,spd:.7, atk:14,reward:14,xp:12,r:.38,lives:2,armor:6,mres:.15,color:'#8a6bff'},
  boss:  {hp:700,spd:.55,atk:30,reward:70,xp:60,r:.47,lives:3,armor:10,mres:.3,color:'#ff3860'},
};
const INCOME_MAX=10;
function mineCost(lv){return 45+30*(lv-1);}
function millCost(lv){return 35+25*(lv-1);}
const WAVE_EVERY=30;

/* ================= 状态 ================= */
let gold,wood,lives,wave,queue,spawnT,incomeT,waveT,cleared,hudAcc;
let mineLv,millLv;
let heroes,mobs,shots,fx,nums,bears,inv;
let sel=null,invSel=null,speed=1,running=false,over=false,openShop=null;

/* ================= 画布 ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let cell=30,dpr=1;
function resize(){
  const st=document.getElementById('stage');
  const w=st.clientWidth-8,h=st.clientHeight-8;
  cell=Math.floor(Math.min(w/COLS,h/ROWS));
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=COLS*cell*dpr;cv.height=ROWS*cell*dpr;
  cv.style.width=COLS*cell+'px';cv.style.height=ROWS*cell+'px';
}
window.addEventListener('resize',()=>setTimeout(resize,60));

/* ================= 英雄 ================= */
function makeHero(cls,row,col){
  const h={cls,row,col,lv:1,xp:0,tier:0,equips:[],
    skills:{},cds:{},cd:0,flash:0,alive:true};
  calc(h);h.hp=h.maxHp;
  return h;
}
function calc(h){
  const b=CLASSES[h.cls],a=h.tier?ADV[h.cls]:null;
  const am=h.tier?1.35:1;
  // 属性 = (基础+成长×等级) ×转职加成 + 装备全属性
  let eqAtk=0,eqArmor=0,eqHp=0,eqAspd=0,eqAll=0,eqMres=0;
  for(const e of h.equips){
    const s=e.stats;
    eqAtk+=s.atk||0;eqArmor+=s.armor||0;eqHp+=s.hp||0;
    eqAspd+=s.aspd||0;eqAll+=s.all||0;eqMres+=s.mres||0;
  }
  h.str=Math.round((b.attr.str+b.grow.str*(h.lv-1))*am)+eqAll;
  h.agi=Math.round((b.attr.agi+b.grow.agi*(h.lv-1))*am)+eqAll;
  h.int=Math.round((b.attr.int+b.grow.int*(h.lv-1))*am)+eqAll;
  // 攻击 = 武器×转职 + 主属性 + 装备
  h.atk=Math.round(b.wep*(a?a.atk:1)+h[b.main]+eqAtk);
  // 生命 = (基础+力量×8)×转职 + 装备
  h.maxHp=Math.round((b.hpB+h.str*8)*(a?a.hp:1)+eqHp);
  // 护甲 = 基础 + 敏捷/7 + 装备（魔兽减伤公式）
  h.armor=Math.round((b.baseArmor+h.agi/7+eqArmor)*10)/10;
  // 魔抗：基础25% + 装备，上限75%
  h.mres=Math.min(.75,.25+eqMres);
  // 攻击间隔 = 基础bat×转职 / (1+敏捷×1.2%+装备攻速)，下限0.35s
  h.interval=Math.max(.35,b.bat*(a?a.bat:1)/(1+h.agi*.012+eqAspd));
  h.range=b.range+(a?a.range:0);
  h.splash=b.splash+(a?a.splash:0);
}
function heroAt(c,r){return heroes.find(h=>h.col===c&&h.row===r);}
function bearIn(row){return bears.find(b=>b.row===row&&!b.dead);}
function frontUnit(row){
  const br=bearIn(row);
  if(br)return br;
  let best=null;
  for(const h of heroes)if(h.alive&&h.row===row&&(!best||h.col>best.col))best=h;
  return best;
}
function rowDefended(row){return !!frontUnit(row);}
function nearestDefendedRow(row){
  let best=-1,bd=99;
  for(let r=0;r<ROWS;r++)if(rowDefended(r)&&Math.abs(r-row)<bd){bd=Math.abs(r-row);best=r;}
  return best;
}
function dispName(h){return h.tier?ADV[h.cls].name:CLASSES[h.cls].name;}

/* ================= 流程 ================= */
function reset(){
  gold=60;wood=0;lives=10;wave=0;queue=[];spawnT=0;incomeT=0;
  waveT=WAVE_EVERY;cleared=true;hudAcc=0;
  mineLv=1;millLv=1;
  heroes=[];mobs=[];shots=[];fx=[];nums=[];bears=[];inv=[];
  sel=null;invSel=null;over=false;openShop=null;
  closeShop();updateHUD();renderInfo();renderInv();
}
function waveComp(w){
  const list=[];const n=4+w*2;
  for(let i=0;i<n;i++){
    let t='normal';
    if(w>=3&&i%3===2)t='fast';
    if(w>=4&&i%4===3)t='tank';
    list.push(t);
  }
  if(w%5===0)list.push('boss');
  return list;
}
function startWave(){
  if(wave>=TOTAL_WAVES)return;
  wave++;queue.push(...waveComp(wave));
  updateHUD();renderInfo();
}
function spawnMob(type){
  const b=MOBS[type],mul=1+0.25*(wave-1);
  const row=Math.floor(Math.random()*ROWS);
  mobs.push({type,row,y:row,x:COLS+.5,
    hp:b.hp*mul,maxHp:b.hp*mul,spd:b.spd,atk:b.atk*mul,r:b.r,
    reward:b.reward,xp:b.xp,lives:b.lives,armor:b.armor,mres:b.mres,
    color:b.color,cd:0,fight:false,slowT:0,slowF:0});
}

/* ================= 伤害 ================= */
function dnum(x,y,val,color){
  if(nums.length>70)nums.shift();
  nums.push({x,y:y-.25,txt:String(Math.max(1,Math.round(val))),color:color||'#fff',t:.8,max:.8});
}
function damage(m,d,color){
  if(m.dead)return;
  m.hp-=d;
  dnum(m.x,m.y+.5,d,color);
  if(m.hp<=0){
    m.dead=true;
    gold+=m.reward;
    gainXp(m.xp);
    updateHUD();refreshAfford();
    fx.push({type:'ring',x:m.x,y:m.y+.5,rr:m.r*1.7,t:.28,max:.28,color:m.color});
  }
}
/* 物理伤害吃怪物护甲，魔法伤害吃怪物魔抗 */
function physDamage(m,d,color){damage(m,d*(1-armorRed(m.armor)),color);}
function magDamage(m,d,color){damage(m,d*(1-m.mres),color);}
function gainXp(x){
  let leveled=false;
  for(const h of heroes){
    if(h.lv>=MAX_HERO_LV)continue;
    h.xp+=x;
    while(h.xp>=xpNeed(h.lv)&&h.lv<MAX_HERO_LV){
      h.xp-=xpNeed(h.lv);h.lv++;calc(h);h.hp=h.maxHp;leveled=true;
      levelFx(h.col+.5,h.row+.5);
    }
  }
  if(leveled&&sel)renderInfo();
}
/* 升级特效：金圈+八向飞溅+LV飘字 */
function levelFx(x,y){
  fx.push({type:'ring',x,y,rr:.85,t:.5,max:.5,color:'#f0e46a'});
  fx.push({type:'aoe',x,y,rr:.55,t:.35,max:.35,color:'#f0e46a'});
  for(let i=0;i<8;i++){
    const a=Math.PI/4*i;
    fx.push({type:'spark',x,y,ax:Math.cos(a),ay:Math.sin(a),t:.45,max:.45,color:'#ffe98a'});
  }
  nums.push({x,y:y-.55,txt:'LV UP',color:'#f0e46a',t:1,max:1});
}

/* ================= 更新 ================= */
function update(dt){
  incomeT+=dt;
  while(incomeT>=1){
    incomeT-=1;
    if(mineLv||millLv){gold+=mineLv;wood+=millLv;updateHUD();refreshAfford();}
  }
  if(wave<TOTAL_WAVES){
    waveT-=dt;
    if(waveT<=0){waveT=WAVE_EVERY;startWave();}
  }
  hudAcc+=dt;
  if(hudAcc>=.25){hudAcc=0;updateHUD();}
  if(queue.length){
    spawnT-=dt;
    if(spawnT<=0){const t=queue.shift();spawnMob(t);spawnT=t==='fast'?.5:.9;}
  }
  const STOP=HCOLS+.35;
  /* 仇恨：本行无守军就转去最近有守军的行 */
  for(const m of mobs){
    if(m.x<=STOP+2&&!rowDefended(m.row)){
      const r=nearestDefendedRow(m.row);
      if(r>=0)m.row=r;
    }
    if(m.y!==m.row){
      const d=m.row-m.y,step=2*dt;
      m.y=Math.abs(d)<=step?m.row:m.y+Math.sign(d)*step;
    }
  }
  for(let r=0;r<ROWS;r++){
    const lane=mobs.filter(m=>m.row===r).sort((a,b)=>a.x-b.x);
    for(let i=0;i<lane.length;i++){
      const m=lane[i],ahead=lane[i-1];
      const blocked=ahead&&(m.x-ahead.x)<.62;
      const spd=m.spd*(m.slowT>0?1-m.slowF:1);
      if(m.slowT>0)m.slowT-=dt;
      m.fight=false;
      const br=bearIn(r);
      if(br&&m.x>br.x&&m.x-br.x<=.68){
        m.cd-=dt;
        if(m.cd<=0){m.cd=1;hitUnit(br,m);}
        continue;
      }
      if(m.x<=STOP&&rowDefended(r)){m.fight=true;}
      else if(!blocked){
        m.x-=spd*dt;
        if(m.x< -0.5){m.dead=true;lives-=m.lives;if(lives<=0){lives=0;endGame(false);}updateHUD();}
      }
      if((m.fight||(blocked&&m.x<=STOP+1.1))&&rowDefended(r)){
        m.cd-=dt;
        if(m.cd<=0){
          m.cd=1;
          const u=frontUnit(r);
          if(u)hitUnit(u,m);
        }
      }
    }
  }
  /* 熊灵 */
  for(const br of bears){
    br.t-=dt;
    if(br.t<=0||br.hp<=0){br.dead=true;continue;}
    br.cd-=dt;
    let best=null;
    for(const m of mobs){
      if(m.dead||m.row!==br.row)continue;
      if(!best||m.x<best.x)best=m;
    }
    if(best){
      const gap=best.x-br.x;
      if(gap>.8){br.x=Math.min(br.x+1.8*dt,COLS-.6);}
      else if(br.cd<=0){
        br.cd=1;
        physDamage(best,br.atk,'#c9a068');
        fx.push({type:'ring',x:best.x,y:best.y+.5,rr:.3,t:.15,max:.15,color:'#c9a068'});
      }
    }else if(br.x>HCOLS+.45){br.x=Math.max(HCOLS+.45,br.x-1.8*dt);}
  }
  bears=bears.filter(b=>!b.dead);
  /* 英雄 */
  for(const h of heroes){
    if(!h.alive)continue;
    if(h.flash>0)h.flash-=dt;
    const hx=h.col+.5,hy=h.row+.5;
    const bb=h.skills['狂战士之血'];
    if(bb){
      const miss=1-h.hp/h.maxHp;
      if(miss>0)h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.02*bb*miss*2*dt);
    }
    for(const name in h.skills){
      const def=SKB[name];
      if(!def.cd)continue;
      h.cds[name]=(h.cds[name]||0)-dt;
      if(h.cds[name]>0)continue;
      if(castSkill(h,name,h.skills[name],hx,hy))h.cds[name]=def.cd;
    }
    h.cd-=dt;if(h.cd>0)continue;
    let best=null;
    for(const m of mobs){
      if(m.dead)continue;
      if(h.cls==='archer'&&Math.abs(m.row-h.row)>1)continue;
      if(h.cls==='warrior'&&m.row!==h.row)continue;
      const d=Math.hypot(m.x-hx,(m.y+.5)-hy);
      if(d<=h.range+m.r&&(!best||m.x<best.x))best=m;
    }
    if(best){
      h.cd=h.interval;
      attack(h,hx,hy,best);
      const ms=h.skills['多重射击'];
      if(ms){
        let extra=Math.floor(ms/2)+((ms%2)&&Math.random()<.5?1:0);
        if(extra>0){
          const others=mobs.filter(m=>{
            if(m.dead||m===best)return false;
            if(h.cls==='archer'&&Math.abs(m.row-h.row)>1)return false;
            if(h.cls==='warrior'&&m.row!==h.row)return false;
            return Math.hypot(m.x-hx,(m.y+.5)-hy)<=h.range+m.r;
          }).sort((a,b)=>a.x-b.x).slice(0,extra);
          for(const o of others)attack(h,hx,hy,o,.7,'#7fe8ff');
        }
      }
    }
  }
  /* 子弹 */
  const SPD=10;
  for(const s of shots){
    if(s.target&&!s.target.dead){s.tx=s.target.x;s.ty=s.target.y+.5;}
    const dx=s.tx-s.x,dy=s.ty-s.y,l=Math.hypot(dx,dy);
    if(l<SPD*dt){
      s.dead=true;
      if(s.splash>0){
        fx.push({type:'ring',x:s.tx,y:s.ty,rr:s.splash,t:.22,max:.22,color:s.color});
        for(const m of mobs){if(!m.dead&&Math.hypot(m.x-s.tx,(m.y+.5)-s.ty)<=s.splash+m.r)shotHit(s,m);}
      }else if(s.target&&!s.target.dead)shotHit(s,s.target);
    }else{s.x+=dx/l*SPD*dt;s.y+=dy/l*SPD*dt;}
  }
  mobs=mobs.filter(m=>!m.dead);
  shots=shots.filter(s=>!s.dead);
  for(const f of fx)f.t-=dt;
  fx=fx.filter(f=>f.t>0);
  for(const n of nums){n.t-=dt;n.y-=.7*dt;}
  nums=nums.filter(n=>n.t>0);
  const empty=!queue.length&&!mobs.length;
  if(!empty)cleared=false;
  else if(!cleared&&wave>0){
    cleared=true;
    gold+=20+wave*6;
    for(const h of heroes){h.alive=true;h.hp=h.maxHp;}
    updateHUD();
    if(wave>=TOTAL_WAVES){endGame(true);return;}
    renderInfo();
  }
}
function attack(h,hx,hy,m,mul,color){
  mul=mul||1;
  const poison=h.skills['沁毒射击']?h.agi*(.35+.15*h.skills['沁毒射击']):0;
  if(h.cls==='warrior'){
    physDamage(m,h.atk*mul,color);
    if(poison)magDamage(m,poison,'#7ce87c');
    fx.push({type:'ring',x:m.x,y:m.y+.5,rr:.35,t:.15,max:.15,color:color||CLASSES[h.cls].color});
    if(h.splash>0)for(const o of mobs){
      if(o!==m&&!o.dead&&Math.hypot(o.x-m.x,o.y-m.y)<=h.splash+o.r)physDamage(o,h.atk*.6*mul);
    }
  }else{
    shots.push({x:hx,y:hy,target:m,tx:m.x,ty:m.y+.5,
      dmg:h.atk*mul,splash:h.splash,poison,color:color||CLASSES[h.cls].color});
  }
}
function shotHit(s,m){
  physDamage(m,s.dmg,s.color==='#7fe8ff'?'#7fe8ff':undefined);
  if(s.poison&&s.target===m)magDamage(m,s.poison,'#7ce87c');
}
function hitUnit(u,m){
  if(u.isBear){
    u.hp-=m.atk;
    dnum(u.x,u.row+.5,m.atk,'#ff8080');
    return;
  }
  const h=u;
  let dmg=m.atk*(1-armorRed(h.armor));   // 英雄护甲减伤
  const bb=h.skills['狂战士之血'];
  if(bb){
    const miss=1-h.hp/h.maxHp;
    dmg*=1-Math.min(.7,miss*(.25+.08*bb));
  }
  h.hp-=dmg;h.flash=.12;
  dnum(h.col+.5,h.row+.5,dmg,'#ff8080');
  const th=h.skills['荆棘光环'];
  if(th)magDamage(m,m.atk*.15*th+h.str*.4*th,'#9dff9d');
  if(h.hp<=0){
    h.hp=0;h.alive=false;
    fx.push({type:'ring',x:h.col+.5,y:h.row+.5,rr:.7,t:.35,max:.35,color:'#fff'});
    renderInfo();
  }
}
function castSkill(h,name,lv,hx,hy){
  if(name==='召唤熊德'){
    if(bearIn(h.row)||!mobs.length)return false;
    bears.push({isBear:true,row:h.row,x:HCOLS+.45,
      hp:120+h.int*6*lv,maxHp:120+h.int*6*lv,atk:8+h.int*.7*lv,
      t:12+2*lv,cd:0,dead:false});
    fx.push({type:'ring',x:HCOLS+.55,y:h.row+.5,rr:.8,t:.4,max:.4,color:'#c9a068'});
    return true;
  }
  if(name==='火球术'){
    let t=null;for(const m of mobs)if(!m.dead&&(!t||m.x<t.x))t=m;
    if(!t)return false;
    fx.push({type:'line',x1:hx,y1:hy,x2:t.x,y2:t.y+.5,t:.35,max:.35,color:'#ffb04f'});
    fx.push({type:'ring',x:t.x,y:t.y+.5,rr:.6,t:.3,max:.3,color:'#ffb04f'});
    magDamage(t,40+h.int*3*lv,'#ffb04f');
    return true;
  }
  if(name==='冰风暴'){
    let t=null;for(const m of mobs)if(!m.dead&&(!t||m.x<t.x))t=m;
    if(!t)return false;
    const R=1.6+.1*lv;
    fx.push({type:'aoe',x:t.x,y:t.y+.5,rr:R,t:.55,max:.55,color:'#7fd8ff'});
    for(const m of mobs){
      if(m.dead)continue;
      if(Math.hypot(m.x-t.x,m.y-t.y)<=R+m.r){
        magDamage(m,25+h.int*1.2*lv,'#7fd8ff');
        m.slowT=2;m.slowF=Math.min(.75,.4+.05*lv);
      }
    }
    return true;
  }
  return false;
}
function endGame(win){
  over=true;running=false;closeShop();
  const ov=document.getElementById('overlay');
  ov.classList.remove('hide');
  ov.innerHTML=win
    ?'<h1>战线守住了</h1><p>15 波全部击退。</p><button class="lg" id="startBtn">再来一局</button>'
    :`<h1 style="color:var(--warrior)">基地陷落</h1><p>坚持到了第 ${wave} 波。</p><button class="lg" id="startBtn">重新开始</button>`;
  document.getElementById('startBtn').onclick=begin;
}
function begin(){
  document.getElementById('overlay').classList.add('hide');
  reset();running=true;resize();
  startWave();waveT=WAVE_EVERY;
}

/* ================= 绘制 ================= */
function rgba(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;
}
function draw(){
  ctx.setTransform(dpr*cell,0,0,dpr*cell,0,0);
  ctx.clearRect(0,0,COLS,ROWS);
  for(let c=0;c<HCOLS;c++){
    const col=CLASSES[COL_CLASS[c]].color;
    ctx.fillStyle=rgba(col,.09);
    for(let r=0;r<ROWS;r++)ctx.fillRect(c+.03,r+.03,.94,.94);
  }
  ctx.fillStyle='#0d1420';
  ctx.fillRect(HCOLS,0,BCOLS,ROWS);
  ctx.strokeStyle='#1c2940';ctx.lineWidth=.02;
  ctx.beginPath();
  for(let c=HCOLS;c<=COLS;c++){ctx.moveTo(c,0);ctx.lineTo(c,ROWS);}
  for(let r=0;r<=ROWS;r++){ctx.moveTo(0,r);ctx.lineTo(COLS,r);}
  ctx.stroke();
  ctx.strokeStyle='rgba(255,93,93,.5)';ctx.lineWidth=.05;
  ctx.beginPath();ctx.moveTo(HCOLS,0);ctx.lineTo(HCOLS,ROWS);ctx.stroke();
  if(sel){
    ctx.strokeStyle='#8ab8d8';ctx.lineWidth=.06;
    ctx.strokeRect(sel.col+.06,sel.row+.06,.88,.88);
  }
  ctx.textAlign='center';
  // 英雄
  for(const h of heroes){
    const b=CLASSES[h.cls],x=h.col+.5,y=h.row+.5;
    ctx.fillStyle=h.alive?(h.flash>0?'#ffffff':b.color):'#333c4c';
    ctx.globalAlpha=h.alive?1:.45;
    ctx.fillRect(x-.32,y-.32,.64,.64);
    ctx.globalAlpha=1;
    if(h.tier){ctx.strokeStyle='#f0c46a';ctx.lineWidth=.05;ctx.strokeRect(x-.34,y-.34,.68,.68);}
    if(h.alive){
      // 血条 + 等级显示在血条左端
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-.24,y-.47,.58,.09);
      ctx.fillStyle='#6ee7a0';ctx.fillRect(x-.24,y-.47,.58*Math.max(h.hp/h.maxHp,0),.09);
      ctx.fillStyle='#0a0e16';ctx.fillRect(x-.45,y-.5,.2,.16);
      ctx.strokeStyle='#f0c46a';ctx.lineWidth=.02;ctx.strokeRect(x-.45,y-.5,.2,.16);
      ctx.fillStyle='#f0c46a';ctx.font='600 .13px -apple-system,sans-serif';
      ctx.fillText(h.lv,x-.35,y-.375);
      // 经验条
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-.34,y+.37,.68,.06);
      ctx.fillStyle='#4f8dff';ctx.fillRect(x-.34,y+.37,.68*(h.lv>=MAX_HERO_LV?1:Math.min(h.xp/xpNeed(h.lv),1)),.06);
    }
  }
  // 熊灵
  for(const br of bears){
    const y=br.row+.5;
    ctx.fillStyle='#c9a068';
    ctx.fillRect(br.x-.26,y-.26,.52,.52);
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(br.x-.28,y-.42,.56,.08);
    ctx.fillStyle='#6ee7a0';ctx.fillRect(br.x-.28,y-.42,.56*Math.max(br.hp/br.maxHp,0),.08);
  }
  // 怪物
  for(const m of mobs){
    const y=m.y+.5;
    ctx.fillStyle=m.color;
    ctx.fillRect(m.x-m.r,y-m.r,m.r*2,m.r*2);
    if(m.slowT>0){ctx.strokeStyle='#7fd8ff';ctx.lineWidth=.045;ctx.strokeRect(m.x-m.r,y-m.r,m.r*2,m.r*2);}
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(m.x-m.r,y-m.r-.15,m.r*2,.08);
    ctx.fillStyle='#6ee7a0';ctx.fillRect(m.x-m.r,y-m.r-.15,m.r*2*Math.max(m.hp/m.maxHp,0),.08);
  }
  for(const s of shots){
    ctx.fillStyle=s.color;
    ctx.beginPath();ctx.arc(s.x,s.y,.09,0,7);ctx.fill();
  }
  for(const f of fx){
    const k=1-f.t/f.max;
    if(f.type==='line'){
      ctx.strokeStyle=f.color;ctx.globalAlpha=1-k;ctx.lineWidth=.07;
      ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();
      ctx.globalAlpha=1;
    }else if(f.type==='aoe'){
      ctx.beginPath();ctx.arc(f.x,f.y,f.rr,0,7);
      ctx.fillStyle=f.color;ctx.globalAlpha=.22*(1-k);ctx.fill();
      ctx.globalAlpha=1-k;ctx.strokeStyle=f.color;ctx.lineWidth=.05;ctx.stroke();
      ctx.globalAlpha=1;
    }else if(f.type==='spark'){
      const d=.25+k*1.1;
      ctx.beginPath();ctx.arc(f.x+f.ax*d,f.y+f.ay*d,.06*(1-k)+.02,0,7);
      ctx.fillStyle=f.color;ctx.globalAlpha=1-k;ctx.fill();ctx.globalAlpha=1;
    }else{
      ctx.beginPath();ctx.arc(f.x,f.y,f.rr*(.4+.6*k),0,7);
      ctx.strokeStyle=f.color;ctx.globalAlpha=1-k;ctx.lineWidth=.06;ctx.stroke();ctx.globalAlpha=1;
    }
  }
  ctx.font='600 .3px -apple-system,sans-serif';
  for(const n of nums){
    ctx.fillStyle=n.color;ctx.globalAlpha=Math.min(1,n.t/n.max*1.6);
    ctx.fillText(n.txt,n.x,n.y);
  }
  ctx.globalAlpha=1;
}

/* ================= UI ================= */
const uiMoney=document.getElementById('uiMoney'),uiWood=document.getElementById('uiWood'),
      uiLife=document.getElementById('uiLife'),uiWave=document.getElementById('uiWave'),
      info=document.getElementById('info'),invEl=document.getElementById('inv'),
      toast=document.getElementById('toast'),ghost=document.getElementById('dragGhost');
const tiles={skill:document.getElementById('tileSkill'),item:document.getElementById('tileItem'),
             mine:document.getElementById('tileMine'),mill:document.getElementById('tileMill')};
let toastT=null;
function showToast(msg){
  toast.innerHTML=msg;toast.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),1800);
}
function updateHUD(){
  uiMoney.textContent=Math.floor(gold);uiWood.textContent=Math.floor(wood);
  uiLife.textContent=lives;
  uiWave.textContent=wave+'/'+TOTAL_WAVES+(running&&!over&&wave<TOTAL_WAVES?' · '+Math.ceil(waveT)+'s':'');
  document.getElementById('mineLvT').textContent='Lv'+mineLv+' +'+mineLv+'/s';
  document.getElementById('millLvT').textContent='Lv'+millLv+' +'+millLv+'/s';
}
function selHero(){return sel?heroAt(sel.col,sel.row):null;}
function skillLine(h){
  const ks=Object.keys(h.skills);
  if(!ks.length)return '<span>技0/'+MAX_SLOTS+'</span>';
  return ks.map(n=>`<span style="color:${CATS[SKB[n].cat].color}">${SKB[n].short}${h.skills[n]}</span>`).join(' ');
}
function equipLine(h){
  if(!h.equips.length)return '<span>装0/'+MAX_EQUIP+'</span>';
  return h.equips.map(e=>`<span style="color:${qOf(e).c}">${EQ_KINDS[e.kind].s}</span>`).join(' ');
}

function renderInfo(){
  if(over)return;
  if(openShop){info.innerHTML=shopHTML();return;}
  if(invSel!=null&&inv[invSel]){
    const it=inv[invSel];
    if(it.t==='book'){
      const d=SKB[it.name];
      info.innerHTML=`<div class="card"><b style="color:${CATS[d.cat].color}">${it.name}</b>
        <span style="color:var(--${d.q==='qblue'?'qblue':'qgreen'})">[${d.q==='qblue'?'蓝':'绿'}]</span>
        <span>${CATS[d.cat].label}系技能书</span><br><span>${d.desc}</span><br><span>拖到英雄上学习，同名升级（上限Lv${MAX_SKILL_LV}）</span></div>`;
    }else{
      const q=qOf(it);
      info.innerHTML=`<div class="card"><b style="color:${q.c}">${q.n}·${EQ_KINDS[it.kind].n}</b><br>
        <span>${eqDesc(it)}</span><br><span>拖到英雄上穿戴（${MAX_EQUIP}个装备位）</span></div>`;
    }
    return;
  }
  const h=selHero();
  let html='';
  if(sel&&!h){
    const cls=COL_CLASS[sel.col],b=CLASSES[cls];
    html=`<div class="card"><b style="color:${b.color}">初始${b.name}</b> <span>${b.desc}</span><br>
      <span>HP ${b.hpB+b.attr.str*8} · 攻 ${b.wep+b.attr[b.main]} · 间隔 ${b.bat}s · 甲 ${b.baseArmor}</span><br>
      <span>力${b.attr.str}(+${b.grow.str}) 敏${b.attr.agi}(+${b.grow.agi}) 智${b.attr.int}(+${b.grow.int})</span></div>
      <button class="btn" id="buyAt" data-cost="${HERO_COST}" data-lock="${heroes.length>=MAX_HEROES?1:0}" ${gold<HERO_COST||heroes.length>=MAX_HEROES?'disabled':''}>
        买入 <span class="cost">${HERO_COST}金</span>${heroes.length>=MAX_HEROES?'<br><span class="sub">已满3人</span>':''}</button>`;
  }else if(h){
    const b=CLASSES[h.cls];
    const advOK=!h.tier&&h.lv>=ADV_LV, canAdv=advOK&&gold>=ADV_GOLD&&wood>=ADV_WOOD;
    const xpTxt=h.lv>=MAX_HERO_LV?'满级':`${Math.floor(h.xp)}/${xpNeed(h.lv)}`;
    html=`<div class="card"><b style="color:${b.color}">${dispName(h)}</b> <b>Lv${h.lv}</b> <span>经验${xpTxt}</span><br>
      <span>HP ${Math.ceil(h.hp)}/${h.maxHp} · 攻 ${h.atk} · 间隔 ${h.interval.toFixed(2)}s · 甲 ${h.armor}(${Math.round(armorRed(h.armor)*100)}%) · 抗 ${Math.round(h.mres*100)}%</span><br>
      <span>力${h.str} 敏${h.agi} 智${h.int}</span> · ${skillLine(h)} · ${equipLine(h)}</div>`;
    if(!h.tier){
      html+=`<button class="btn" id="advBtn" data-cost="${ADV_GOLD}" data-wood="${ADV_WOOD}" data-lock="${advOK?0:1}" ${canAdv?'':'disabled'}>
        转职·${ADV[h.cls].name}<br><span class="sub">需Lv${ADV_LV}</span> <span class="cost">${ADV_GOLD}金</span>+<span class="costw">${ADV_WOOD}木</span></button>`;
    }
  }else{
    const n=mobs.length+queue.length;
    html=`<div class="hint">${n?'第 '+wave+' 波 — 剩余 '+n:'点 3×3 格子买英雄；技能书/装备从背包拖到英雄身上'}</div>`;
  }
  info.innerHTML=html;
  const ba=document.getElementById('buyAt');
  if(ba)ba.onclick=()=>{
    if(gold>=HERO_COST&&heroes.length<MAX_HEROES&&sel&&!heroAt(sel.col,sel.row)){
      gold-=HERO_COST;
      heroes.push(makeHero(COL_CLASS[sel.col],sel.row,sel.col));
      updateHUD();renderInfo();
    }
  };
  const ab=document.getElementById('advBtn');
  if(ab)ab.onclick=()=>{
    const hh=selHero();if(!hh||hh.tier||hh.lv<ADV_LV)return;
    if(gold>=ADV_GOLD&&wood>=ADV_WOOD){
      gold-=ADV_GOLD;wood-=ADV_WOOD;
      hh.tier=1;calc(hh);hh.hp=hh.maxHp;
      levelFx(hh.col+.5,hh.row+.5);
      updateHUD();renderInfo();
    }
  };
}

/* ---- 商店 ---- */
function setShop(kind){
  openShop=openShop===kind?null:kind;
  invSel=null;
  for(const k in tiles)tiles[k].classList.toggle('on',k===openShop);
  renderInfo();
}
function closeShop(){
  openShop=null;
  for(const k in tiles)tiles[k].classList.remove('on');
}
function shopHTML(){
  if(openShop==='skill'){
    return `<div class="card shopHead"><b>技能商店</b><br><span>每次${PACK_N}本进背包</span></div>`+
      Object.entries(CATS).map(([cat,c])=>
        `<button class="btn grow" data-pack="${cat}" data-cost="${PACK_COST}" data-lock="0" ${gold>=PACK_COST?'':'disabled'}>
          <b style="color:${c.color}">${c.label}</b> <span class="cost">${PACK_COST}金</span>
          <span class="sub">${Object.keys(SKB).filter(n=>SKB[n].cat===cat).join('/')}</span></button>`).join('')+
      `<button class="btn grow" data-pack="roll" data-cost="${ROLL_COST}" data-lock="0" ${gold>=ROLL_COST?'':'disabled'}>
        <b style="color:#f0c46a">ROLL</b> <span class="cost">${ROLL_COST}金</span>
        <span class="sub">全池7种·半价</span></button>`;
  }
  if(openShop==='item'){
    return `<div class="card shopHead"><b>装备商店</b><br><span>随机部位+品质<br>白55/绿27/蓝13/紫5%</span></div>
      <button class="btn grow" data-eqroll="1" data-cost="${EQ_ROLL1}" data-lock="0" ${gold>=EQ_ROLL1?'':'disabled'}>
        <b>roll ×1</b> <span class="cost">${EQ_ROLL1}金</span>
        <span class="sub">剑/甲/靴/戒/披 随机一件</span></button>
      <button class="btn grow" data-eqroll="4" data-cost="${EQ_ROLL4}" data-lock="0" ${gold>=EQ_ROLL4?'':'disabled'}>
        <b>roll ×4</b> <span class="cost">${EQ_ROLL4}金</span>
        <span class="sub">四连抽，略有折扣</span></button>`;
  }
  const isMine=openShop==='mine';
  const lv=isMine?mineLv:millLv, cost=isMine?mineCost(lv):millCost(lv);
  const head=`<div class="card shopHead"><b>${isMine?'金矿':'伐木场'} Lv${lv}/${INCOME_MAX}</b><br><span>每秒 +${lv} ${isMine?'金币':'木头'}</span></div>`;
  if(lv>=INCOME_MAX)
    return head+`<button class="btn grow" disabled><b>已满级</b><span class="sub">每秒 +${lv} ${isMine?'金币':'木头'}</span></button>`;
  return head+
    `<button class="btn grow" data-shop="${openShop}" data-cost="${cost}" data-lock="0" ${gold>=cost?'':'disabled'}>
      <b>升级到 Lv${lv+1}</b> <span class="cost">${cost}金</span>
      <span class="sub">每秒 +${lv} → +${lv+1}${isMine?'':'（木头用于转职）'}</span></button>`;
}
function refreshAfford(){
  document.querySelectorAll('#info [data-cost]').forEach(b=>{
    b.disabled=b.dataset.lock==='1'||gold<+b.dataset.cost||wood<+(b.dataset.wood||0);
  });
}
tiles.skill.addEventListener('click',()=>setShop('skill'));
tiles.item.addEventListener('click',()=>setShop('item'));
tiles.mine.addEventListener('click',()=>setShop('mine'));
tiles.mill.addEventListener('click',()=>setShop('mill'));

/* ---- 背包（技能书+装备混放）---- */
function buyPack(cat){
  const cost=cat==='roll'?ROLL_COST:PACK_COST;
  if(gold<cost)return;
  gold-=cost;
  const pool=cat==='roll'?Object.keys(SKB):Object.keys(SKB).filter(n=>SKB[n].cat===cat);
  for(let i=0;i<PACK_N;i++)inv.push({t:'book',name:pool[Math.floor(Math.random()*pool.length)]});
  updateHUD();renderInfo();renderInv();
}
function buyEquip(n){
  const cost=n===4?EQ_ROLL4:EQ_ROLL1;
  if(gold<cost)return;
  gold-=cost;
  for(let i=0;i<n;i++)inv.push(rollEquip());
  updateHUD();renderInfo();renderInv();
}
function renderInv(){
  invEl.querySelectorAll('.book').forEach(e=>e.remove());
  inv.forEach((it,i)=>{
    const el=document.createElement('div');
    el.className='book';
    el.dataset.idx=i;
    if(it.t==='book'){
      const d=SKB[it.name];
      el.style.borderColor=d.q==='qblue'?'var(--qblue)':'var(--qgreen)';
      el.style.color=CATS[d.cat].color;
      el.innerHTML=`${d.short}<small>技能书</small>`;
    }else{
      const q=qOf(it);
      el.style.borderColor=q.c;
      el.style.color=q.c;
      el.innerHTML=`${EQ_KINDS[it.kind].s}<small>${q.n}</small>`;
    }
    invEl.appendChild(el);
  });
}
function applyItem(idx,h){
  const it=inv[idx];if(!it||!h)return;
  if(it.t==='book'){
    const cur=h.skills[it.name]||0;
    if(cur>=MAX_SKILL_LV){showToast(`${it.name} 已满级`);return;}
    if(!cur&&Object.keys(h.skills).length>=MAX_SLOTS){showToast('技能位已满（4个）');return;}
    h.skills[it.name]=cur+1;
    fx.push({type:'ring',x:h.col+.5,y:h.row+.5,rr:.6,t:.4,max:.4,color:CATS[SKB[it.name].cat].color});
  }else{
    if(h.equips.length>=MAX_EQUIP){showToast('装备位已满（4件）');return;}
    h.equips.push(it);
    const ratio=h.hp/h.maxHp;calc(h);h.hp=Math.round(h.maxHp*ratio);
    fx.push({type:'ring',x:h.col+.5,y:h.row+.5,rr:.6,t:.4,max:.4,color:qOf(it).c});
  }
  inv.splice(idx,1);
  renderInv();
  if(selHero()===h)renderInfo();
}
/* 拖拽：短按查看说明，拖到英雄上使用 */
let drag=null;
invEl.addEventListener('pointerdown',ev=>{
  const el=ev.target.closest('.book');if(!el)return;
  drag={idx:+el.dataset.idx,sx:ev.clientX,sy:ev.clientY,moved:false};
  ghost.innerHTML=el.outerHTML;
  ev.preventDefault();
});
window.addEventListener('pointermove',ev=>{
  if(!drag)return;
  if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>10)drag.moved=true;
  if(drag.moved){
    ghost.style.display='block';
    ghost.style.left=(ev.clientX-20)+'px';
    ghost.style.top=(ev.clientY-46)+'px';
  }
});
window.addEventListener('pointerup',ev=>{
  if(!drag)return;
  ghost.style.display='none';
  const {idx,moved}=drag;drag=null;
  if(!moved){
    invSel=idx;closeShop();sel=null;renderInfo();
    return;
  }
  const rect=cv.getBoundingClientRect();
  const c=Math.floor((ev.clientX-rect.left)/cell),r=Math.floor((ev.clientY-rect.top)/cell);
  if(c>=0&&c<HCOLS&&r>=0&&r<ROWS){
    const h=heroAt(c,r);
    if(h)applyItem(idx,h);
    else showToast('拖到已购买的英雄方块上');
  }
});

info.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.pack){buyPack(b.dataset.pack);return;}
  if(b.dataset.eqroll){buyEquip(+b.dataset.eqroll);return;}
  if(b.dataset.shop){
    const isMine=b.dataset.shop==='mine';
    const lv=isMine?mineLv:millLv;
    if(lv>=INCOME_MAX)return;
    const cost=isMine?mineCost(lv):millCost(lv);
    if(gold>=cost){gold-=cost;if(isMine)mineLv++;else millLv++;updateHUD();renderInfo();}
    return;
  }
});
cv.addEventListener('pointerdown',ev=>{
  if(!running)return;
  const rect=cv.getBoundingClientRect();
  const c=Math.floor((ev.clientX-rect.left)/cell),r=Math.floor((ev.clientY-rect.top)/cell);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;
  sel=c<HCOLS?{col:c,row:r}:null;
  invSel=null;
  if(sel)closeShop();
  renderInfo();
});
document.getElementById('speedBtn').addEventListener('click',ev=>{
  speed=speed===1?2:1;
  ev.currentTarget.textContent='×'+speed;
  ev.currentTarget.classList.toggle('on',speed===2);
});
document.getElementById('startBtn').addEventListener('click',begin);

/* ================= 主循环 ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(running&&!over)update(dt*speed);
  draw();
  requestAnimationFrame(loop);
}
reset();resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
