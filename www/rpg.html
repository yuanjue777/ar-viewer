<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>方块战线</title>
<link rel="stylesheet" href="rpg.css">
</head>
<body>
<div id="app">
  <header>
    <div class="stat money"><b id="uiMoney">0</b><small>金</small></div>
    <div class="stat woodS"><b id="uiWood">0</b><small>木</small></div>
    <div class="stat life"><b id="uiLife">0</b><small>基地</small></div>
    <div class="stat wave"><b id="uiWave">0/15</b><small>波</small></div>
    <button class="hbtn" id="speedBtn">×1</button>
    <button class="hbtn" id="launchBtn" style="display:none;background:#2a6ee0;border-color:#2a6ee0;color:#fff">▶ 启动</button>
  </header>
  <div id="stage"><canvas id="cv"></canvas><div id="fps">--</div></div>
  <div id="dock">
    <button class="tile hire" id="hireBtn"><span class="ic"></span>招募英雄<span class="lv" id="hireLv">免费</span></button>
    <div class="spacer"></div>
    <button class="tile trial" data-trial="gold"><span class="cdmask"></span><span class="ic"></span>金币试炼<span class="lv">就绪</span></button>
    <button class="tile trial" data-trial="wood"><span class="cdmask"></span><span class="ic"></span>木头试炼<span class="lv">就绪</span></button>
    <button class="tile trial" data-trial="xp"><span class="cdmask"></span><span class="ic"></span>经验试炼<span class="lv">就绪</span></button>
    <button class="tile trial" data-trial="elite"><span class="cdmask"></span><span class="ic"></span>精英试炼<span class="lv">Lv5波</span></button>
  </div>
  <div id="info"><div class="hint"></div></div>
  <div id="inv">
    <div class="invLabel">背包</div>
    <div id="invItems"></div>
    <button id="sellAll">一键<br>出售</button>
  </div>
</div>

<div id="dragGhost"></div>
<div id="toast"></div>

<div id="overlay">
  <h1>方块战线</h1>
  <div class="cls">
    <span><i style="background:var(--mage)"></i>法师·主智力</span>
    <span><i style="background:var(--archer)"></i>游侠·主敏捷</span>
    <span><i style="background:var(--warrior)"></i>战士·主力量</span>
  </div>
  <p>共 25 波，15 波后强度加速爬升。进场先<b>布阵</b>：买英雄、逛商店，准备好后点<b>右上角 ▶ 启动</b>才开始进攻。智力给蓝量回蓝，主动技能耗蓝；技能书/装备 roll 进背包拖给英雄；点技能栏/装备栏可看详情。</p>
  <button class="lg" id="startBtn">开 始</button>
</div>

<div id="cards"><div id="cardTitle"></div><div id="cardBody"><div id="cardInfo"></div><div id="cardRow"></div></div><button id="cardCancel">取消</button></div>

<div id="rotate"><div class="ph">📱</div><div>请横屏游玩</div></div>

<script src="vendor/three.min.js"></script>
<script src="rpg3d.js"></script>
<script src="rpg.js"></script>
</body>
</html>
