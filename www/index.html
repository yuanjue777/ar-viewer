<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <title>AR 模型投影</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="lib/model-viewer.min.js"></script>
  <style>
    .libbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 16px; background: #11141c; border-bottom: 1px solid #222a38; }
    .libbar input { flex: 1; min-width: 150px; padding: 9px 11px; border-radius: 9px;
      border: 1px solid #2c3547; background: #1f2532; color: #f2f4f8; font-size: 13px; }
    .libbar button { padding: 9px 14px; border: none; border-radius: 9px; background: #4f7cff;
      color: #fff; font-size: 13px; font-weight: 600; }
    .libbar__status { width: 100%; font-size: 12px; color: #9aa3b2; }
    .tag { font-size: 11px; color: #4f7cff; background: rgba(79,124,255,.15);
      padding: 1px 7px; border-radius: 999px; vertical-align: middle; }
  </style>
</head>
<body>
  <!-- ============ 第一页：模型 + 开启 AR ============ -->
  <section id="view-home" class="view view--active">
    <header class="topbar">
      <span class="topbar__title">AR 投影</span>
      <button class="topbar__btn" data-go="list">模型库 ›</button>
    </header>

    <main class="home">
      <model-viewer
        id="viewer"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1"
        auto-rotate
        auto-rotate-delay="3000"
        alt="3D 模型">
        <div class="mv-progress" slot="progress-bar"></div>
      </model-viewer>

      <div class="home__panel">
        <h1 id="model-name" class="home__name">模型</h1>
        <p id="model-desc" class="home__desc"></p>
        <button id="ar-btn" class="btn btn--primary">开启 AR</button>
        <p id="ar-hint" class="home__hint"></p>
      </div>
    </main>
  </section>

  <!-- ============ 第二页：模型库 ============ -->
  <section id="view-list" class="view">
    <header class="topbar">
      <button class="topbar__btn" data-go="home">‹ 返回</button>
      <span class="topbar__title">模型库</span>
      <button class="topbar__btn" id="refresh-lib">刷新</button>
    </header>
    <div class="libbar">
      <input id="server-url" placeholder="模型库地址 http://IP:8000" />
      <button id="save-server">保存</button>
      <div class="libbar__status" id="lib-status"></div>
    </div>
    <main class="list" id="model-list"></main>
  </section>

  <script src="models.js"></script>
  <script src="app.js"></script>
</body>
</html>
